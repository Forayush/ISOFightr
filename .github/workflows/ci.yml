name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Python comes from .python-version; --locked fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (sim and CPU AI are strictly typed)
        run: uv run mypy src/isofightr/sim src/isofightr/ai

      # The default marker filter skips `slow` soak tests and `gl` tests (no display in CI).
      - name: Pytest
        run: uv run pytest
