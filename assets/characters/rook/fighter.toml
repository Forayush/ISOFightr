# Rook: the all-rounder and reference character. Every new mechanic is tuned on Rook first.
# Units: world units (1 = one tile edge) and frames (60 per second).
id = "rook"
display_name = "Rook"
archetype = "the all-rounder"
blurb = "A young knight. Solid at everything, with big committed swings."
weight = 98

[movement]
walk_speed = 0.075           # units/frame at full tilt without dashing
dash_speed = 0.131           # initial dash burst
dash_frames = 12
run_speed = 0.125
traction = 0.0075             # ground deceleration per frame
jumpsquat = 3                # grounded frames before leaving the ground
full_hop_vz = 0.300
short_hop_vz = 0.180
double_jump_vz = 0.280
air_jumps = 1
air_accel = 0.0072
air_speed = 0.084            # cap on self-controlled horizontal air speed
air_friction = 0.002
gravity = 0.012
max_fall = 0.180
fast_fall = 0.260
land_lag = 3

[body]
radius = 0.30                # environment collision radius
height = 2.5
hurtbox = { radius = 0.35, z0 = 0.2, z1 = 2.3 }   # vertical capsule above the feet
shield_radius_max = 1.2      # shield sphere radius at full shield HP

[moveset]                    # input slot -> move id (a file in moves/)
jab = ["jab1", "jab2", "jab3"]
ftilt = "ftilt"
utilt = "utilt"
dtilt = "dtilt"
dash_attack = "dash_attack"
fsmash = "fsmash"
usmash = "usmash"
dsmash = "dsmash"
nair = "nair"
fair = "fair"
bair = "bair"
uair = "uair"
dair = "dair"
getup_attack = "getup_attack"
ledge_attack = "ledge_attack"
nspecial = "nspecial"        # Crescent Wave
sspecial = "sspecial"        # Lunge
uspecial = "uspecial"        # Rising Spin
dspecial = "dspecial"        # Riposte (counters with riposte_hit)
taunt = "taunt"

[grab]                       # frames are 1-indexed and inclusive; offset = forward, left, up
standing = { frames = "6-7", total = 34, offset = [0.75, 0.0, 1.2], radius = 0.45 }
dash = { frames = "9-11", total = 43, offset = [0.85, 0.0, 1.2], radius = 0.45, slide = 0.07 }
pummel = { damage = 1.5, cooldown = 18 }

[throws]                     # release = the frame the victim is damaged and launched
forward = { damage = 8.0, angle = 40, bkb = 60, kbg = 60, release = 13, total = 34 }
back = { damage = 10.0, angle = 42, bkb = 60, kbg = 75, release = 16, total = 38 }
up = { damage = 7.0, angle = 88, bkb = 60, kbg = 70, release = 14, total = 36 }
down = { damage = 5.0, angle = 70, bkb = 55, kbg = 40, release = 18, total = 34 }

