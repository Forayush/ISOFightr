# Sky Ruins: the default competitive stage. A rounded 13x9 island with three soft platforms
# (two low, one high).
# The grid is top-down in WORLD space: row = world y (row 0 = smallest y), column = world x.
# On screen, +x runs toward the bottom-right and +y toward the bottom-left.
id = "sky_ruins"
display_name = "Sky Ruins"
description = "The classic: one island and three soft platforms."
tileset = "grass_stone"
music = "sky_ruins"            # a song in assets/audio/music

# Legend: '.' = void, '0'..'9' = solid cell with that top height in units (0 = main floor).
grid = """
..000000000..
.00000000000.
0000000000000
0000000000000
0000000000000
0000000000000
0000000000000
.00000000000.
..000000000..
"""

[legend]
"0" = { height = 0, tile = "grass" }

# The platforms sit along the screen-horizontal diagonal (constant x + y), so on screen they
# read as low-left, high-centre, low-right. In this top-down grid that looks diagonal.
[[soft_platforms]]           # rect = x0, y0, x1, y1 in cell coordinates; z = deck height
rect = [2, 6, 5, 9]          # low, screen-left
z = 2.5
[[soft_platforms]]
rect = [8, 0, 11, 3]         # low, screen-right
z = 2.5
[[soft_platforms]]
rect = [5, 3, 8, 6]          # high, centre
z = 4.5

[spawns]                     # world (x, y); z = surface height
p1 = [2.5, 4.5]
p2 = [10.5, 4.5]
p3 = [6.5, 1.5]
p4 = [6.5, 7.5]
respawn = [6.5, 4.5]

[blast_zone]                 # margins from the stage's solid bounding box
side = 7.0
top = 12.0
bottom = -8.0

[camera]
bounds_margin = 4.0

# Parallax backdrop (tools/build_backdrop.py sky_ruins): 0 = fixed to the screen, 1 = moves
# with the stage. `music` arrives with M11 audio.
[[background]]
image = "bg_0_sky.png"
parallax = 0.0

[[background]]
image = "bg_1_far_clouds.png"
parallax = 0.08

[[background]]
image = "bg_2_islands.png"
parallax = 0.18

[[background]]
image = "bg_3_near_clouds.png"
parallax = 0.35
