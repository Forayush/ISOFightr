at = [12.0, 3.5]
layer = "ground"
period = 10
phase = 5
[[props]]
sprite = "arrow_east"
at = [11.0, 4.5]
layer = "ground"
period = 10
[[props]]
sprite = "arrow_east"
at = [13.0, 4.5]
