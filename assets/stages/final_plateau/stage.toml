# Final Plateau: a flat 14x10 island with no platforms. The plain, no-excuses stage.
# Its look (decision D-063): a slab of rune-cut flagstone under an aurora, at night. It has
# no mechanic: the "stage hazards" rule changes nothing here.
# The grid is top-down in WORLD space: row = world y (row 0 = smallest y), column = world x.
# On screen, +x runs toward the bottom-right and +y toward the bottom-left.
id = "final_plateau"
display_name = "Final Plateau"
description = "A flat slab of runestone. No platforms, no excuses."
tileset = "runestone"
music = "final_plateau"            # a song in assets/audio/music

# Legend: '.' = void, '0'..'9' = solid cell with that top height in units (0 = main floor).
grid = """
00000000000000
00000000000000
00000000000000
00000000000000
00000000000000
00000000000000
00000000000000
00000000000000
00000000000000
00000000000000
"""

[legend]
"0" = { height = 0, tile = "flag" }

[spawns]                     # world (x, y); z = surface height
p1 = [3.5, 5.0]
p2 = [10.5, 5.0]
p3 = [7.0, 2.5]
p4 = [7.0, 7.5]
respawn = [7.0, 5.0]

[blast_zone]                 # margins from the stage's solid bounding box
side = 7.0
top = 12.0
bottom = -8.0

[camera]
bounds_margin = 4.0

# Parallax backdrop (tools/build_backdrop.py final_plateau --theme aurora --mood night --seed 9).
[[background]]
image = "bg_0_sky.png"
parallax = 0.0

[[background]]
image = "bg_1_stars.png"     # two frames: some stars twinkle
parallax = 0.01
frames = 2
frame_ticks = 40

[[background]]
image = "bg_2_aurora_far.png"   # three frames: the curtain shimmers
parallax = 0.03
scroll = 0.01
frames = 3
frame_ticks = 22

[[background]]
image = "bg_3_aurora.png"
parallax = 0.05
scroll = 0.02
frames = 3
frame_ticks = 16

[[background]]
image = "bg_4_peaks.png"
parallax = 0.1

[[background]]
image = "bg_5_bank.png"
parallax = 0.3
scroll = 0.03

# Looks only (decision D-063): none of this collides or changes how the stage plays.
[underside]
depth = 2.5
hang = ["shard", "stalactite"]

[ambient]
kind = "motes"
count = 12
front = 3

[[props]]                    # flat on the ground: the great seal and the runes, pulsing
sprite = "sigil"
at = [7.0, 5.0]
layer = "ground"
period = 30
[[props]]
sprite = "rune_a"
at = [2.5, 2.5]
layer = "ground"
period = 24
[[props]]
