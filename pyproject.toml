[project]
name = "isofightr"
version = "0.1.0"
description = "ISOFightr: a local-multiplayer isometric platform fighter built with Python Arcade."
authors = [{ name = "Forayush", email = "ayushpramodshetty@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: Arcade's API moves between minor versions (decision D-001).
    "arcade==3.3.3",
    "pillow>=11.3.0",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not slow and not gl", "--strict-markers"]
markers = [
    "slow: long soak tests; run with `pytest -m slow`",
    "gl: needs a real OpenGL window; run locally with `pytest -m gl`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
