# The small UI icons (decision D-061), drawn as text: one character per pixel, 12 by 12.
# `tools/build_ui_art.py` packs them into assets/ui/icons.png; a test fails if that file is
# out of date with this one. All original art. Colours are Resurrect 64 entries.
#
# White ("#") is the part the game recolours (gold on a focused row, a player's colour...);
# the other colours are kept as drawn.

size = 12

[legend]
"." = ""
"#" = "ffffff"
"+" = "9babb2"
"o" = "2e222f"

# name = "flip:other" mirrors another icon left to right; "turn:other" turns it a quarter
# turn anticlockwise.
[derived]
arrow_right = "flip:arrow_left"
arrow_down = "turn:arrow_left"
arrow_up = "flip_v:arrow_down"

