# Rook's hero art (decision D-061): the big key pose shown on character select, the loading
# screen and the victory screen. Rook is the all-rounder, a young knight, eager and earnest:
# his bouncy ready stance, knees bent and weight forward on wide feet, buckler presented and
# the sword cocked high for one of his big committed swings.
# Built by `tools/build_art.py rook --hero`, at twice the game's pixels per unit.

[camera]
turn = -20        # degrees turned from facing the viewer (+ = toward the screen's right)
elevation = 12    # degrees the camera looks down (30 is the game's view from above)

[[poses]]
use = "ready"
offset = [0.0, 0.0, -0.12]
hips = [0.0, 0.0, 10.0]
chest = [-12.0, 0.0, -8.0]
head = [14.0, 0.0, 4.0]
cape = [-40.0, 0.0, 14.0]
shoulder_r = [10.0, -152.0, 0.0]
elbow_r = [10.0, 0.0, 0.0]
hand_r = [-84.0, 0.0, 0.0]
shoulder_l = [44.0, 0.0, -46.0]
elbow_l = [88.0, 0.0, 0.0]
hip_r = [30.0, -16.0, -12.0]
knee_r = [-48.0, 0.0, 0.0]
ankle_r = [18.0, 0.0, 0.0]
hip_l = [-6.0, 18.0, 20.0]
knee_l = [-34.0, 0.0, 0.0]
ankle_l = [36.0, 0.0, -10.0]
