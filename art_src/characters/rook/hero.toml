# Rook's hero art (decision D-061): the big key pose shown on character select, the loading
# screen and the victory screen. Rook is the all-rounder, a young knight: a balanced guard,
# feet planted, buckler leading and the sword held high beside it, looking straight at you.
# Confident, not showy.
# Built by `tools/build_art.py rook --hero`, at twice the game's pixels per unit.

[camera]
turn = 10        # degrees turned from facing the viewer (+ = toward the screen's right)
elevation = 12    # degrees the camera looks down (30 is the game's view from above)

[[poses]]
use = "ready"
hips = [0.0, 0.0, 16.0]
chest = [4.0, 0.0, -12.0]
head = [4.0, 0.0, 10.0]
cape = [-24.0, 0.0, 12.0]
shoulder_r = [10.0, -160.0, 0.0]
elbow_r = [10.0, 0.0, 0.0]
hand_r = [-84.0, 0.0, 0.0]
shoulder_l = [66.0, 0.0, 34.0]
elbow_l = [64.0, 0.0, 0.0]
hip_r = [22.0, 0.0, -18.0]
knee_r = [-28.0, 0.0, 0.0]
ankle_r = [8.0, 0.0, 0.0]
hip_l = [-18.0, 0.0, 26.0]
knee_l = [-12.0, 0.0, 0.0]
ankle_l = [22.0, 0.0, -14.0]
