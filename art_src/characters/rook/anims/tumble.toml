# Tumble (D-066): a head-over-heels turn, back first, the top moving with the travel,
# 12 poses 30 degrees apart about the tucked body's middle, the cape trailing.
# The selector picks the pose from a rotation angle that follows the launch speed; the
# sheet's direction is the opposite of the travel. Written by
# build/scratch/m16_author_hurt.py; this file is the source.
