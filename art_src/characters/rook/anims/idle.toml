# Idle: a bouncy ready stance (sword forward and up, buckler raised), breathing in four poses.
loop = true
fps = 6

# `base` applies to every pose; a pose's own values replace it joint by joint.
[base]
hips = [0.0, 0.0, 12.0]
chest = [6.0, 0.0, -8.0]
head = [-4.0, 0.0, -6.0]
cape = [-8.0, 0.0, 0.0]
shoulder_r = [30.0, 0.0, -14.0]
elbow_r = [55.0, 0.0, 0.0]
hand_r = [-40.0, 0.0, 0.0]
shoulder_l = [35.0, 0.0, 22.0]
elbow_l = [70.0, 0.0, 0.0]
hip_r = [14.0, 0.0, -6.0]
knee_r = [-24.0, 0.0, 0.0]
ankle_r = [10.0, 0.0, 0.0]
hip_l = [-6.0, 0.0, 18.0]
knee_l = [-16.0, 0.0, 0.0]
ankle_l = [22.0, 0.0, -10.0]

[[poses]]
offset = [0.0, 0.0, 0.0]

[[poses]]
offset = [0.0, 0.0, -0.02]
chest = [8.0, 0.0, -8.0]
cape = [-5.0, 0.0, 0.0]

[[poses]]
offset = [0.0, 0.0, -0.04]
chest = [10.0, 0.0, -8.0]
cape = [-3.0, 0.0, 2.0]
knee_r = [-30.0, 0.0, 0.0]
knee_l = [-22.0, 0.0, 0.0]

[[poses]]
offset = [0.0, 0.0, -0.02]
chest = [8.0, 0.0, -8.0]
cape = [-6.0, 0.0, 1.0]
