leather = ["e6904e", "cd683d", "9e4539", "7a3045", "45293f"]
gold = ["fbff86", "fbb954", "f79617", "cd683d", "7a3045"]
ink = ["2e222f", "2e222f", "2e222f", "2e222f", "2e222f"]
