# Rook: a young knight with a short sword (right hand) and a buckler (left forearm).
# Puppet rig (decision D-044): rigid parts on joints, no skinning.
#
# Blender space: forward +y, the character's right +x, up +z, feet at the origin. 1 unit = one
# tile edge; Rook is 2.5 units tall (40 px), the height of his body in fighter.toml.
#
# Joints: `at` is relative to the parent joint. Pose rotations are [x, y, z] degrees in the
# joint's own space (XYZ order): +x swings a limb forward (a hanging arm comes up in front),
# +y rolls it toward the character's left, +z turns it to the left.
#
# Parts hang from a joint; their coordinates are in that joint's space.
#   box:  low, high              ball: centre, radius, scale = [sx, sy, sz] (optional)
#   rod:  a, b, r1, r2 (a tapered cylinder from a to b; r2 = 0 makes a cone)
# Every part has a material from palettes.toml. `hidden = true` parts (smears) only appear
# in poses that `show` them.

[[joints]]
name = "hips"
parent = ""
at = [0.0, 0.0, 0.88]

[[joints]]
name = "chest"
parent = "hips"
at = [0.0, 0.0, 0.10]

[[joints]]
name = "head"
parent = "chest"
at = [0.0, 0.0, 0.50]

[[joints]]
name = "cape"
parent = "chest"
at = [0.0, -0.27, 0.42]

[[joints]]
name = "shoulder_r"
parent = "chest"
at = [0.33, 0.0, 0.38]

[[joints]]
name = "elbow_r"
parent = "shoulder_r"
at = [0.0, 0.0, -0.27]

[[joints]]
name = "hand_r"
parent = "elbow_r"
at = [0.0, 0.0, -0.25]

[[joints]]
name = "shoulder_l"
parent = "chest"
at = [-0.33, 0.0, 0.38]

[[joints]]
name = "elbow_l"
parent = "shoulder_l"
at = [0.0, 0.0, -0.27]

[[joints]]
name = "hand_l"
parent = "elbow_l"
at = [0.0, 0.0, -0.25]

[[joints]]
name = "hip_r"
parent = "hips"
at = [0.14, 0.0, -0.04]

[[joints]]
name = "knee_r"
parent = "hip_r"
at = [0.0, 0.0, -0.38]

[[joints]]
name = "ankle_r"
parent = "knee_r"
at = [0.0, 0.0, -0.36]

[[joints]]
name = "hip_l"
parent = "hips"
at = [-0.14, 0.0, -0.04]

[[joints]]
name = "knee_l"
parent = "hip_l"
at = [0.0, 0.0, -0.38]

[[joints]]
name = "ankle_l"
parent = "knee_l"
at = [0.0, 0.0, -0.36]

