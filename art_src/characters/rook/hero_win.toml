# His face for this picture. The rig's own face is two eyes; here he gets a character's:
# dark brows (one cocked), a glint in each eye, a button nose, a fringe of hair under the
# helmet, a chin strap, and a lopsided open grin showing his teeth. Eager and a bit cheeky.
# The parts hug the face's surface (a ball of radius 0.38 centred on 0, 0.03, 0.38), or they
# slide when the head tilts.
