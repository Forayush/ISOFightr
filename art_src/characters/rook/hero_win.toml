# Rook's win picture (decision D-061): sword thrust straight up, buckler arm flung wide, chin
# up. Rendered from hero.toml's camera. (Without this file the first pose of the victory
# animation would be used; from the front its sword crosses his face.)
[[poses]]
use = "ready"
hips = [0.0, 0.0, 6.0]
chest = [10.0, 0.0, -4.0]
head = [14.0, 0.0, 4.0]
