# Zephyr's materials and costumes (decision D-045). Colours must come from the master palette
# (art_src/palettes/resurrect64.toml). Each ramp: highlight, light, mid, shadow, outline.
# Costume 0 is the default; costumes 1-4 are the red, blue, yellow and green team colours
# (only the main and accent ramps change); costume 5 is an alternative.

master = "resurrect64"
bands = [0.86, 0.50, 0.16]   # light >= bands[0]: highlight; >= bands[1]: light; >= bands[2]: mid; else shadow

[[materials]]
name = "fur"
# the main costume colour

[[materials]]
name = "fur_dark"

[[materials]]
name = "cream"

[[materials]]
name = "feather"
# crest, wings and tail accents

[[materials]]
name = "accent"
# the courier scarf

[[materials]]
name = "leather"

[[materials]]
name = "ink"
lit = false

[[materials]]
name = "smear"
lit = false
outline = false

