# Zephyr's hero art (decision D-061). Zephyr is the rushdown: a small bird-fox courier,
# restless and showy, who fights with quick kicks and flips. Caught in the air mid flying
# kick: one leg driven straight out at you, the other tucked, wing-arms flung wide for
# balance, scarf and tail streaming. She is showing off, and she is already on top of you.
# Built by `tools/build_art.py zephyr --hero`, at twice the game's pixels per unit.

[camera]
turn = 20         # degrees turned from facing the viewer (+ = toward the screen's right)
elevation = 10    # degrees the camera looks down (30 is the game's view from above)

[[poses]]
use = "ready"
offset = [0.0, 0.0, 0.3]
hips = [16.0, 0.0, 0.0]
chest = [8.0, 0.0, 12.0]
head = [-2.0, 0.0, 34.0]
cape = [-46.0, 0.0, -80.0]
shoulder_r = [-10.0, -96.0, 0.0]
elbow_r = [16.0, 0.0, 0.0]
hand_r = [0.0, 0.0, 0.0]
shoulder_l = [-24.0, 74.0, 0.0]
elbow_l = [24.0, 0.0, 0.0]
hand_l = [0.0, 0.0, 0.0]
hip_r = [96.0, 0.0, 0.0]
knee_r = [-6.0, 0.0, 0.0]
ankle_r = [-24.0, 0.0, 0.0]
hip_l = [52.0, 0.0, 10.0]
knee_l = [-116.0, 0.0, 0.0]
ankle_l = [30.0, 0.0, 0.0]

# Her face for this picture (the rig's own has only eyes and a nose): one brow cocked and a
# smirk on the muzzle.
[[parts]]
name = "brow_r"
joint = "head"
shape = "rod"
a = [0.06, 0.29, 0.43]
b = [0.17, 0.25, 0.47]
r1 = 0.018
r2 = 0.018
material = "ink"

