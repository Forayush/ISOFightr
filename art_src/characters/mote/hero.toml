# Mote's hero art (decision D-061). Mote is the zoner: a hooded lantern mage, calm and eerie,
# who keeps you at a distance. Drifting a little off the upright, head tipped to one side as
# if listening, the lantern held out at arm's length beside the dark of the hood so its
# light is the first thing you see, the free hand open and low. It is in no hurry.
# Built by `tools/build_art.py mote --hero`, at twice the game's pixels per unit.

[camera]
turn = -14        # degrees turned from facing the viewer (+ = toward the screen's right)
elevation = 8     # degrees the camera looks down (30 is the game's view from above)

[[poses]]
use = "ready"
offset = [0.0, 0.0, 0.3]
hips = [0.0, 6.0, 6.0]
chest = [2.0, -3.0, -6.0]
head = [-4.0, 12.0, 6.0]
cape = [-30.0, 0.0, 0.0]
shoulder_r = [100.0, 0.0, -66.0]
elbow_r = [0.0, 0.0, 0.0]
hand_r = [-100.0, 0.0, 0.0]
shoulder_l = [12.0, 42.0, 0.0]
elbow_l = [44.0, 0.0, 0.0]
hand_l = [0.0, 0.0, 0.0]
hip_r = [10.0, 0.0, 0.0]
knee_r = [-26.0, 0.0, 0.0]
ankle_r = [46.0, 0.0, 0.0]
hip_l = [-4.0, 0.0, 0.0]
knee_l = [-12.0, 0.0, 0.0]
ankle_l = [50.0, 0.0, 0.0]
