# Mote: a floaty lantern mage. A hooded robe whose hood holds only darkness and two glowing eyes;
# a lantern hangs from a short staff in the right hand; the robe hides the legs but for the
# feet. Puppet rig (decision D-044): rigid parts on joints, no skinning.
#
# Blender space: forward +y, the character's right +x, up +z, feet at the origin; 1 unit = one
# tile edge. Joint names match Rook's (rig.toml there explains the conventions), so poses and
# animations carry over; `cape` is whatever hangs behind (Bramble's mantle, Zephyr's tail,
# Mote's robe flap). See art_src/characters/rook/rig.toml for the shapes.

[[joints]]
name = "origin"
parent = ""
at = [0.0, 0.0, 0.0]

[[joints]]
name = "hips"
parent = ""
at = [0.0, 0.0, 0.85]

[[joints]]
name = "chest"
parent = "hips"
at = [0.0, 0.0, 0.12]

[[joints]]
name = "head"
