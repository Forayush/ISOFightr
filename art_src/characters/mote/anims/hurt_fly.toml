# Damage-fly (D-066): the body along its trajectory, back first, head leading on the way
# up, limbs flung toward the front. One pose per elevation of the travel: straight up,
# up and away, level, down and away, straight down. The selector picks the pose; the
# sheet's direction is the opposite of the travel. Written by
# build/scratch/m16_author_hurt.py; this file is the source.
loop = true
fps = 1

[[smears]]
name = "lid_r"
joint = "head"
shape = "box"
low = [0.035, 0.385, 0.285]
high = [0.145, 0.442, 0.395]
material = "shadow"

[[smears]]
name = "lash_r"
joint = "head"
shape = "box"
low = [0.040, 0.442, 0.328]
high = [0.140, 0.460, 0.352]
material = "glow"

[[smears]]
