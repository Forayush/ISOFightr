# Bramble's hero art (decision D-061). Bramble is the heavy: a mossy stone golem. He does
# not pose, he looms: squared up to the viewer, feet wide and flat, huge fists hanging low
# and a little forward, head sunk between the shoulders. Stiff and immovable, seen from low
# down so he towers.
# Built by `tools/build_art.py bramble --hero`, at twice the game's pixels per unit.

[camera]
turn = 10        # degrees turned from facing the viewer (+ = toward the screen's right)
elevation = 4    # degrees the camera looks down (30 is the game's view from above)

[[poses]]
use = "ready"
offset = [0.0, 0.0, 0.0]
hips = [0.0, 0.0, 0.0]
chest = [-6.0, 0.0, 0.0]
head = [-6.0, 0.0, 0.0]
cape = [0.0, 0.0, 0.0]
shoulder_r = [14.0, -26.0, 10.0]
elbow_r = [22.0, 0.0, 0.0]
hand_r = [0.0, 0.0, 0.0]
shoulder_l = [14.0, 26.0, -10.0]
elbow_l = [22.0, 0.0, 0.0]
hand_l = [0.0, 0.0, 0.0]
hip_r = [4.0, -14.0, -12.0]
knee_r = [-8.0, 0.0, 0.0]
ankle_r = [4.0, 0.0, 0.0]
hip_l = [4.0, 14.0, 12.0]
knee_l = [-8.0, 0.0, 0.0]
ankle_l = [4.0, 0.0, 0.0]
