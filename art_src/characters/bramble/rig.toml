# Bramble: a mossy stone golem. Hunched, with a small head sunk between huge shoulders, long
# arms ending in boulder fists, stubby legs, moss on his back and head, a glowing crystal in his
# chest and glowing eyes. Puppet rig (decision D-044): rigid parts on joints, no skinning.
#
# Blender space: forward +y, the character's right +x, up +z, feet at the origin; 1 unit = one
# tile edge. Joint names match Rook's (rig.toml there explains the conventions), so poses and
# animations carry over; `cape` is whatever hangs behind (Bramble's mantle, Zephyr's tail,
# Mote's robe flap). See art_src/characters/rook/rig.toml for the shapes.

[[joints]]
name = "origin"
parent = ""
at = [0.0, 0.0, 0.0]

[[joints]]
name = "hips"
parent = ""
at = [0.0, 0.0, 0.95]

[[joints]]
name = "chest"
parent = "hips"
at = [0.0, 0.0, 0.15]

[[joints]]
name = "head"
