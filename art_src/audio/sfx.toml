# ISOFightr sound effects, as synthesizer recipes (decision D-055).
# Rendered to assets/audio/sfx/<name>.wav by `uv run python tools/build_audio.py`.
# Each [[name.layers]] is one voice (fields of isofightr.audio.synth.Voice; times in seconds,
# freq in Hz or a note name). `include` layers other whole sounds on top.

