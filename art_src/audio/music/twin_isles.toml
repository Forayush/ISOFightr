# Hop the Gap: Twin Isles (decision D-063). A folk jig in F major: six quavers to the bar,
# felt as two beats (126 of those a minute, which is 189 crotchets: the tempo below). A
# plucked string carries the tune, a whistle doubles it and sings over the second part, an
# accordion pushes on each beat, with a shaker, a wood block and a frame drum.
# Rendered by tools/build_audio.py; written with build/scratch/m14_song_twin.py.
# Steps: a note, '-' holds it, '.' rests, 'x' hits a drum; one line is one bar.
id = "twin_isles"
title = "Hop the Gap"
tempo = 189
steps_per_beat = 2
key = "F"
mode = "major"
meter = "6/8"
form = ["intro", "tune", "tune2", "turn", "tune3", "turn2", "outro"]

[echo]
beats = 1.5
feedback = 0.25
mix = 0.3
lowpass = 0.5

[sections.intro]              # 4 bars: the accordion sets the beat, the whistle calls
level = 0.7
to = 1.0
play = ["call", "acc_i_root", "acc_i_third", "acc_i_fifth", "bass_i", "shaker*0.7"]

[sections.tune]               # 8 bars: the tune, plucked
kind = "verse"
level = 0.9
play = ["tune_a", "acc_a_root", "acc_a_third", "acc_a_fifth", "bass_a", "drum", "shaker"]

[sections.tune2]              # again, the whistle an octave above
kind = "verse"
play = ["tune_a", "whistle_a+12*0.8", "acc_a_root", "acc_a_third", "acc_a_fifth", "bass_a",
        "drum", "shaker", "block"]

[sections.turn]               # 8 bars: the second part, the whistle holding long notes over it
kind = "chorus"
play = ["tune_b", "air_b", "acc_b_root", "acc_b_third", "acc_b_fifth", "bass_b", "drum",
        "shaker", "block"]

[sections.tune3]              # the tune once more, quieter: pluck and bass, the drum off
kind = "break"
level = 0.75
play = ["tune_a", "bass_a", "shaker*0.8", "block"]

[sections.turn2]              # and the second part with everything
kind = "chorus"
play = ["tune_b", "whistle_b+12*0.7", "air_b*0.8", "acc_b_root", "acc_b_third", "acc_b_fifth",
        "bass_b", "drum", "shaker", "block"]

[sections.outro]              # 4 bars home
to = 0.8
play = ["call", "acc_i_root", "acc_i_third", "acc_i_fifth", "bass_i", "drum", "shaker"]

[instruments.string]          # a plucked string, bright
wave = "pluck"
damp = 0.5
release = 0.2
volume = 0.6
send = 0.15

[instruments.whistle]
wave = "sine"
attack = 0.03
decay = 0.05
sustain = 0.8
release = 0.06
vibrato_depth = 0.3
vibrato_rate = 6.0
volume = 0.22
send = 0.4

[instruments.accordion]       # a reed, muffled a little
