# Dusk on the Water: Lily Pads (decision D-063). A slow, swung waltz in G dorian: the
# raised sixth (E) keeps the minor key from turning sad. A music box plays the tune, a muted
# plucked bass gives the first beat of each bar and brushes the other two, and a soft pad
# holds the chords under an echo. Rendered by tools/build_audio.py; written with
# build/scratch/m14_song_lily.py.
# Steps: a note, '-' holds it, '.' rests, 'x' hits a drum; one line is one bar.
id = "lily_pads"
title = "Dusk on the Water"
tempo = 92
steps_per_beat = 2
key = "G"
mode = "dorian"
meter = "3/4"
swing = 0.22
form = ["intro", "tune", "turn", "tune2"]

[echo]
beats = 1.0
feedback = 0.38
mix = 0.36
lowpass = 0.4

[sections.intro]              # 4 bars: the pad rises, the music box winds up
level = 0.6
to = 1.0
play = ["call", "pad_i_root", "pad_i_third", "pad_i_fifth", "brush*0.7"]

[sections.tune]               # 8 bars: Gm C Gm C Bb F C Dm
kind = "verse"
level = 0.9
play = ["tune_a", "pad_a_root", "pad_a_third", "pad_a_fifth", "bass_a", "thump", "brush"]

[sections.turn]               # 8 bars: Bb F Gm C Bb F Dm Gm, sparser, drops of glass above
kind = "chorus"
play = ["tune_b", "drops", "pad_b_root", "pad_b_third", "pad_b_fifth", "bass_b", "thump",
        "brush", "rim"]

[sections.tune2]              # the tune again, doubled an octave down, the glass answering
kind = "verse"
play = ["tune_a", "tune_a-12*0.45", "drops*0.8", "pad_a_root", "pad_a_third", "pad_a_fifth",
        "bass_a", "thump", "brush", "rim"]

[instruments.box]             # a music box: a bright, short bell
wave = "bell"
mod_ratio = 4.0
mod_index = 1.4
attack = 0.002
release = 0.5
lowpass = 0.7
volume = 0.2
send = 0.35

[instruments.glass]           # drops of glass, high and far away
wave = "ping"
length = 0.5
lowpass = 0.8
release = 0.3
volume = 0.26
send = 0.6

[instruments.bass]            # a plucked bass, muted
wave = "pluck"
damp = 0.85
release = 0.12
lowpass = 0.4
volume = 0.5

[instruments.wash]            # a soft pad, slow to speak
wave = "pad"
detune = 9
attack = 0.3
release = 0.4
lowpass = 0.35
volume = 0.2
send = 0.2

[instruments.thump]           # a felt beater on the first beat
wave = "drum"
freq = 64
freq_end = 44
length = 0.18
noise = 0.0
release = 0.08
volume = 0.4

[instruments.brush]           # a brush on the second and third beats
wave = "noise"
freq = 3200
length = 0.1
attack = 0.02
release = 0.07
lowpass = 0.35
volume = 0.2

[instruments.rim]             # a soft click before the third beat
wave = "ping"
freq = 820
length = 0.05
lowpass = 0.5
release = 0.03
volume = 0.2

