# Last Stone Standing: Final Plateau (decision D-063). A finale in E minor at 160: a bass
# that never stops running in sixteenths, a heavy kick on every beat, a choir of detuned
# saws holding the chords, a saw lead, and strings that climb through the chorus while a
# bell tolls the bar. Rendered by tools/build_audio.py; written with
# build/scratch/m14_song_final.py.
# Steps: a note, '-' holds it, '.' rests, 'x' hits a drum; one line is one bar.
id = "final_plateau"
title = "Last Stone Standing"
tempo = 160
steps_per_beat = 4
key = "E"
mode = "minor"
meter = "4/4"
form = ["intro", "verse", "chorus", "bridge", "chorus2"]

[echo]
beats = 0.75
feedback = 0.28
mix = 0.26
lowpass = 0.5

[sections.intro]              # 4 bars: Em Em C D; the bass starts running, the choir swells
level = 0.55
to = 1.0
play = ["call", "run_i", "choir_i_root", "choir_i_third", "choir_i_fifth", "kick", "hat*0.6"]

[sections.verse]              # 8 bars: Em C G D, twice
level = 0.9
play = ["verse", "run_v", "choir_v_root", "choir_v_third", "choir_v_fifth", "kick", "snare",
        "hat"]

[sections.chorus]             # 8 bars: C D Em G, C D Bm Em; the strings climb
play = ["chorus", "rise_c", "toll", "run_c", "choir_c_root", "choir_c_third", "choir_c_fifth",
        "kick", "snare", "hat", "crash"]

[sections.bridge]             # 4 bars: Am C D D; quiet, building back
level = 0.55
to = 1.0
play = ["rise_b", "run_b", "choir_b_root", "choir_b_third", "choir_b_fifth", "kick*0.8",
        "roll"]

[sections.chorus2]            # the chorus again, the lead doubled an octave down
kind = "chorus"
play = ["chorus", "chorus-12*0.5", "rise_c", "toll", "run_c", "choir_c_root", "choir_c_third",
        "choir_c_fifth", "kick", "snare", "hat", "crash"]

