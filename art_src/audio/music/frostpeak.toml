# Summit Morning: Frostpeak (decision D-063). Bright and cold, in A lydian: the raised
# fourth (D#) is the glitter on the snow. A bell runs up and down each chord, glass answers
# it two octaves up, a triangle carries the tune over a soft pad, a plucked bass walks, and
# sleigh bells keep time. Rendered by tools/build_audio.py; written with
# build/scratch/m14_song_frost.py.
# Steps: a note, '-' holds it, '.' rests, 'x' hits a drum; one line is one bar.
id = "frostpeak"
title = "Summit Morning"
tempo = 135
steps_per_beat = 4
key = "A"
mode = "lydian"
meter = "4/4"
form = ["intro", "verse", "chorus", "verse2"]

[echo]
