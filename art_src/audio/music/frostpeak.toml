feedback = 0.36
mix = 0.3
lowpass = 0.7

[sections.intro]              # 4 bars: A B A B; the bell alone, then the pad and the sleigh
level = 0.65
to = 1.0
play = ["arp_i", "pad_i_root", "pad_i_third", "pad_i_fifth", "sleigh*0.6"]

[sections.verse]              # 8 bars: A B A B F#m B E E
level = 0.9
play = ["verse", "arp_v*0.8", "pad_v_root", "pad_v_third", "pad_v_fifth", "bass_v", "kick",
        "sleigh"]

[sections.chorus]             # 8 bars: A B C#m B A B E A; glass above everything
play = ["chorus", "arp_c*0.8", "glass_c+24", "pad_c_root", "pad_c_third", "pad_c_fifth",
        "bass_c", "kick", "sleigh", "clap"]

[sections.verse2]             # the verse again, the glass staying
kind = "verse"
play = ["verse", "verse+12*0.4", "arp_v*0.8", "glass_v+24*0.8", "pad_v_root", "pad_v_third",
        "pad_v_fifth", "bass_v", "kick", "sleigh", "clap"]

