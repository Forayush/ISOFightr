# All Hands: Storm Galleon (decision D-063). A storm shanty in B minor, fast: a fiddle
# saws out the tune, an accordion pushes on every off-beat over a bass that walks from root
# to fifth, with a deep drum, a snare of spray and the ship's bell.
# Rendered by tools/build_audio.py; written with build/scratch/m14_song_galleon.py.
# Steps: a note, '-' holds it, '.' rests, 'x' hits a drum; one line is one bar of eight
# quavers.
