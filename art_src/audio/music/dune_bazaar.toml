# Seven Coins: Dune Bazaar (decision D-063). A market dance in seven: each bar is counted
# 2 + 2 + 3. D phrygian dominant, the scale with a flat second (Eb) under a major third
# (F#). A lute carries the tune, a flute doubles it the last time, reeds hold a drone, and a
# hand drum plays the low "dum" at the start of each group and the high "tek" between,
# with finger cymbals on the bar. Rendered by tools/build_audio.py; written with
# build/scratch/m14_song_bazaar.py.
# Steps: a note, '-' holds it, '.' rests, 'x' hits a drum; one line is one bar of seven.
id = "dune_bazaar"
title = "Seven Coins"
tempo = 108
steps_per_beat = 2
key = "D"
mode = "phrygian_dominant"
meter = "7/8"
form = ["intro", "tune", "turn", "tune2"]

[echo]
beats = 1.0
feedback = 0.25
mix = 0.22
lowpass = 0.6

[sections.intro]              # 4 bars on D: the drone and the drum, then the lute calls
level = 0.65
to = 1.0
play = ["call", "drone_i_root", "drone_i_fifth", "dum", "tek*0.7"]

[sections.tune]               # 8 bars: D D Eb D, D D Cm D
kind = "verse"
level = 0.9
play = ["tune_a", "drone_a_root", "drone_a_fifth", "bass_a", "dum", "tek", "zill"]

[sections.turn]               # 8 bars: Gm Gm D D, Eb Eb Cm D
kind = "chorus"
play = ["tune_b", "drone_b_root", "drone_b_fifth", "bass_b", "dum", "tek", "zill", "shake"]

[sections.tune2]              # the tune again, a flute an octave above the lute
kind = "verse"
play = ["tune_a", "flute_a+12*0.8", "drone_a_root", "drone_a_fifth", "bass_a", "dum", "tek",
        "zill", "shake"]

[instruments.lute]            # a plucked string, bright and dry
wave = "pluck"
damp = 0.2
release = 0.15
volume = 0.62
send = 0.2

[instruments.flute]           # breathy, with a deep vibrato
wave = "sine"
attack = 0.04
decay = 0.05
sustain = 0.85
release = 0.08
vibrato_depth = 0.4
vibrato_rate = 6.5
volume = 0.2
send = 0.35

[instruments.drone]           # reeds, open and nasal
