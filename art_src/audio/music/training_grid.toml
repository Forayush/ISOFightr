# Practice Makes: Training Grid (decision D-063). A calm pulse in D dorian at 112: a sine
# sequence climbing and falling through each chord, a muffled saw ticking under it, a sine
# bass, and almost no drums, so that it can loop for an hour of practice without wearing.
# Rendered by tools/build_audio.py; written with build/scratch/m14_song_training.py.
# Steps: a note, '-' holds it, '.' rests, 'x' hits a drum; one line is one bar.
id = "training_grid"
title = "Practice Makes"
tempo = 112
steps_per_beat = 4
key = "D"
mode = "dorian"
meter = "4/4"
form = ["intro", "loop", "open", "home"]

[echo]
beats = 0.75
feedback = 0.42
mix = 0.34
lowpass = 0.45

[sections.intro]              # 4 bars: Dm G Dm G; the sequence alone, the saw fading in
level = 0.7
to = 1.0
play = ["seq_i", "pulse_i*0.6", "tick*0.6"]

[sections.loop]               # 8 bars: Dm G Dm G Am G F G
kind = "verse"
level = 0.9
play = ["seq_a", "pulse_a", "bass_a", "kick", "tick"]

[sections.open]               # 8 bars: F C G Dm F C Am G; a slow tune over the top
kind = "chorus"
play = ["lead_b", "seq_b", "pulse_b", "bass_b", "kick", "tick"]

[sections.home]               # 4 bars: Dm G Dm G; the tune comes down to rest
kind = "verse"
to = 0.8
play = ["lead_out", "seq_i", "pulse_i", "bass_i", "kick", "tick"]

[instruments.seq]             # a clean sine, plucked
wave = "sine"
attack = 0.003
decay = 0.12
sustain = 0.25
release = 0.1
volume = 0.3
send = 0.4

[instruments.pulse]           # a saw with the top taken off
wave = "saw"
attack = 0.003
decay = 0.06
sustain = 0.3
release = 0.03
lowpass = 0.25
volume = 0.3
send = 0.1

[instruments.lead]            # a sine that takes its time
wave = "sine"
attack = 0.06
decay = 0.1
sustain = 0.8
release = 0.2
vibrato_depth = 0.15
vibrato_rate = 4.5
volume = 0.2
send = 0.35

[instruments.bass]
wave = "sine"
attack = 0.01
release = 0.1
lowpass = 0.6
volume = 0.22

[instruments.kick]            # soft, on the first and third beats
wave = "drum"
freq = 72
freq_end = 46
length = 0.14
noise = 0.0
release = 0.06
volume = 0.36

[instruments.tick]            # a small click on the off-beats
wave = "ping"
freq = 2100
length = 0.03
release = 0.02
volume = 0.16

