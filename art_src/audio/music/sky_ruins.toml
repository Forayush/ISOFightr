feedback = 0.3
mix = 0.32
lowpass = 0.55

[sections.intro]              # 4 bars: the strings swell, the brass calls
level = 0.55
to = 1.0
play = ["call", "str_i_root", "str_i_third", "str_i_fifth", "timp_roll"]

[sections.verse]              # 8 bars: D D C C G G D D
level = 0.9
play = ["tune", "answer", "bass_v", "str_v_root", "str_v_third", "str_v_fifth",
        "timp", "kick", "hat*0.8"]

[sections.chorus]             # 8 bars: G D C D G D C D
play = ["soar", "peal", "bass_c", "str_c_root", "str_c_third", "str_c_fifth",
        "timp", "kick", "snare", "hat"]

[sections.bridge]             # 4 bars: C G C Am, quiet, building back
level = 0.6
to = 1.0
play = ["chime", "bass_b", "str_b_root", "str_b_third", "str_b_fifth", "timp_roll*0.8"]

[sections.chorus2]            # the chorus again, the brass doubled an octave down
kind = "chorus"
play = ["soar", "soar-12*0.5", "peal", "bass_c", "str_c_root", "str_c_third", "str_c_fifth",
        "timp", "kick", "snare", "hat"]

