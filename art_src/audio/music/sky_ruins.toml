# Above the Ruins: Sky Ruins (decision D-063). A heroic fanfare in D mixolydian: the flat
# seventh (C) under a major tune is what makes it sound like banners and open sky. Pulse
# "brass" carries the tune, a bell answers it, strings (a pad) hold the chords, and timpani
# mark the bar. Rendered by tools/build_audio.py.
# Steps: a note, '-' holds it, '.' rests, 'x' hits a drum; one line is one bar.
id = "sky_ruins"
title = "Above the Ruins"
tempo = 144
steps_per_beat = 4
key = "D"
mode = "mixolydian"
meter = "4/4"
form = ["intro", "verse", "chorus", "bridge", "chorus2"]

[echo]
