# The pond tileset has no rig: each tile's geometry is in its own file ([[parts]]).
# Blender space, like the fighters: a cell spans x, y in 0..1, its top at z = 0.

[[joints]]
name = "origin"
parent = ""
at = [0.0, 0.0, 0.0]

# Props (decision D-063): a prop stands on, or hangs from, the origin. `lamp` is where the
# lantern hangs from the end of its pole's arm, so it can sway.
[[joints]]
name = "lamp"
parent = "origin"
at = [0.26, -0.26, 1.62]
