[[smears]]
name = "lamp_on"
joint = "origin"
shape = "ball"
centre = [0.000, 0.000, 2.360]
radius = 0.070
scale = [1.000, 1.000, 1.000]
material = "red_on"

[[smears]]
name = "lamp_off"
joint = "origin"
shape = "ball"
centre = [0.000, 0.000, 2.360]
radius = 0.070
scale = [1.000, 1.000, 1.000]
material = "red_off"

[[poses]]
show = ["lamp_on"]

[[poses]]
show = ["lamp_off"]
