[[smears]]
name = "on"
joint = "origin"
shape = "box"
low = [-0.140, 0.200, -0.560]
high = [0.200, -0.140, -0.360]
material = "magenta"

[[smears]]
name = "off"
joint = "origin"
shape = "box"
low = [-0.140, 0.200, -0.560]
high = [0.200, -0.140, -0.360]
material = "magenta_dim"

[[poses]]
show = ["on"]

[[poses]]
show = ["off"]
